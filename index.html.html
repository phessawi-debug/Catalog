<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masimo Q3 2024 Catalog – Devices and Sensors</title>
<style>
:root{--bg:#f2f5f3;--ink:#13201b;--mute:#5d6b65;--line:#d6dfda;--acc:#0d7a63;--accbg:#dff0ea;--pn:#b3122b;--surface:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--ink:#e6efeb;--mute:#93a39b;--line:#24332d;--acc:#4fd1b0;--accbg:#173129;--pn:#ff7088;--surface:#16211d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--ink:#e6efeb;--mute:#93a39b;--line:#24332d;--acc:#4fd1b0;--accbg:#173129;--pn:#ff7088;--surface:#16211d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:64px;height:28px;flex:none;stroke:var(--acc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;margin:0;line-height:1.3}
.sub{margin:0;font-size:12.5px;color:var(--mute)}
.tabs{display:flex;gap:4px;margin:10px 0 8px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 4px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.tabs small{font-weight:400;opacity:.8}
input[type=search]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:0 14px 40px}
.gh{margin:18px 0 4px;font-size:13px;font-weight:700;color:var(--acc);display:flex;justify-content:space-between;direction:ltr}
.gh span{font-weight:400;color:var(--mute)}
.row{border-bottom:1px solid var(--line);direction:ltr}
.row>button{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;cursor:pointer;box-sizing:border-box}
.row>button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.th{width:64px;height:56px;flex:none;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.th img{max-width:100%;max-height:100%}
.tx{flex:1;min-width:0}
.pn{font-size:12px;font-weight:700;color:var(--pn)}
.ti{font-weight:600;font-size:14.5px;line-height:1.35}
.chev{flex:none;color:var(--mute);font-size:18px;transition:transform .15s}
.row.open .chev{transform:rotate(90deg)}
.row.open .th{display:none}
.row:not(.open) .pnline{display:none}
.pnline{display:flex;align-items:center;gap:10px;padding:0 0 8px;direction:ltr}
.pnline .lb{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.pnline .num{font-size:20px;font-weight:700;color:var(--pn);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cpi{all:unset;cursor:pointer;display:inline-flex;padding:6px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--surface)}
.cpi:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pnline .pg{margin-left:auto;font-size:12px;color:var(--mute)}
.det{display:none;padding:2px 0 14px}
.row.open .det{display:block}
.big{background:#fff;border-radius:8px;text-align:center;padding:8px;margin-bottom:8px}
.big img{max-width:100%;max-height:200px}
.det ul{margin:0;padding:0 0 0 18px}.det li{margin:3px 0;font-size:14px}
.note{margin-top:6px;font-size:12.5px;color:var(--mute);font-style:italic}
.term{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);direction:ltr}
.term b{width:64px;flex:none;color:var(--acc)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.bar{display:flex;align-items:center;gap:6px;padding:8px 0 0}.bar .sp{flex:1}
.bar button,.empty button{font:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.empty button{margin:4px;font-size:13px}
#cnt{font-size:12.5px;color:var(--mute)}
.pg{margin-left:8px;font-weight:400;color:var(--mute)}
.cp{margin-top:8px;font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--acc);border-radius:8px;background:var(--accbg);color:var(--ink);cursor:pointer}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.on{opacity:1}
</style>
</head>

const SIZES=[["all","All sizes"],["Adt","Adult"],["Pdt","Pediatric"],["Inf","Infant"],["Neo","Neonatal"]];
const TABS=["monitors","sensors","gloss"];
let tab="monitors",grp="all",size="all",q="";
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function applyTheme(t){document.documentElement.dataset.theme=t;$("#th").textContent=t==="dark"?"☀️":"🌙"}
applyTheme(store.get("th")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#th").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(t);store.set("th",t)};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1600)}
async function copy(x){let ok=false;try{await navigator.clipboard.writeText(x);ok=true}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{ok=document.execCommand("copy")}catch(_){}a.remove()}toast(ok?"Copied":"Copy is not available here")}
const count=k=>D[k].reduce((n,g)=>n+g.items.length,0);
$("#c-monitors").textContent="("+count("monitors")+")";$("#c-sensors").textContent="("+count("sensors")+")";
function chips(el,list,cur,on){el.innerHTML="";list.forEach(([v,t])=>{const b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",v===cur);b.onclick=()=>on(v);el.appendChild(b)})}
function terms(){return q.split(/\s+/).filter(Boolean)}
function match(it){
 const h=(it.pn+" "+it.title+" "+it.lines.join(" ")+" "+it.note).toLowerCase();
 if(!terms().every(t=>h.includes(t)))return false;
 if(tab==="sensors"&&size!=="all"&&!new RegExp("\\b"+size+"\\b").test(it.title))return false;
 return true}
function setOpen(r,o){r.classList.toggle("open",o);r.firstChild.setAttribute("aria-expanded",o);const im=r.querySelector(".big img");if(o&&!im.src)im.src=im.dataset.s}
function row(it){
 const r=document.createElement("div");r.className="row";
 const b=document.createElement("button");b.setAttribute("aria-expanded","false");
 b.innerHTML='<span class="th"><img alt=""></span><span class="tx"><div class="ti"></div></span><span class="chev" aria-hidden="true">›</span>';
 b.querySelector("img").src=it.img;b.querySelector(".ti").textContent=it.title;
 const d=document.createElement("div");d.className="det";
 const big=document.createElement("div");big.className="big";const im=document.createElement("img");im.alt=it.title;im.dataset.s=it.img;big.appendChild(im);d.appendChild(big);
 if(it.lines.length){const u=document.createElement("ul");it.lines.forEach(l=>{const li=document.createElement("li");li.textContent=l;u.appendChild(li)});d.appendChild(u)}
 if(it.note){const n=document.createElement("div");n.className="note";n.textContent=it.note;d.appendChild(n)}
 
 b.onclick=()=>setOpen(r,!r.classList.contains("open"));
 const pl=document.createElement("div");pl.className="pnline";pl.innerHTML='<span class="lb">Part Number</span><span class="num"></span><button class="cpi" type="button" aria-label="Copy part number" title="Copy part number"></button><span class="pg"></span>';pl.querySelector(".num").textContent=it.pn;pl.querySelector(".pg").textContent="p. "+it.page;const ci=pl.querySelector(".cpi");ci.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';ci.onclick=()=>copy(it.pn);r.appendChild(b);r.appendChild(pl);r.appendChild(d);setOpen(r,true);return r}
function empty(m){
 m.innerHTML='<div class="empty"><p>No results. Try another word or clear the filter.</p></div>';
 const e=m.firstChild;[["monitors","Devices"],["sensors","Sensors"],["gloss","Glossary"]].forEach(([t,n])=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>goTab(t);e.appendChild(b)})}
function render(){
 const m=$("#list");m.innerHTML="";
 $("#grp").style.display=(tab==="gloss")?"none":"flex";
 $("#size").style.display=(tab==="sensors")?"flex":"none";
 $("#exp").style.display=$("#col").style.display=(tab==="gloss")?"none":"";
 if(tab==="gloss"){
  const t=D.gloss.filter(g=>terms().every(x=>(g.k+" "+g.v).toLowerCase().includes(x)));
  t.forEach(g=>{const e=document.createElement("div");e.className="term";e.innerHTML="<b></b><span></span>";e.querySelector("b").textContent=g.k;e.querySelector("span").textContent=g.v;m.appendChild(e)});
  $("#cnt").textContent=t.length+" terms";if(!t.length)empty(m);return}
 chips($("#grp"),[["all","All"]].concat(D[tab].map(g=>[g.name,g.name])),grp,v=>{grp=v;render()});
 if(tab==="sensors")chips($("#size"),SIZES,size,v=>{size=v;render()});
 let n=0;
 D[tab].forEach(g=>{if(grp!=="all"&&g.name!==grp)return;const its=g.items.filter(match);if(!its.length)return;
  const h=document.createElement("div");h.className="gh";h.innerHTML="<b></b><span></span>";h.firstChild.textContent=g.name;h.lastChild.textContent=g.page?"p. "+g.page:"";m.appendChild(h);
  its.forEach(i=>{m.appendChild(row(i));n++})});
 $("#cnt").textContent=n+" products";if(!n)empty(m)}
function goTab(t){tab=t;grp="all";size="all";document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===t));render();scrollTo(0,0);try{history.replaceState(null,"","#"+t)}catch(e){}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>goTab(b.dataset.t));
const all=o=>document.querySelectorAll(".row").forEach(r=>setOpen(r,o));
$("#exp").onclick=()=>all(true);$("#col").onclick=()=>all(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")all(false)});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
const h0=(location.hash||"").slice(1);
if(TABS.includes(h0))goTab(h0);else render();
</script>
